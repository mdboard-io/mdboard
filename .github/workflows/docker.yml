name: docker

on:
  push:
    branches:
      - upstream
      - nightly
      - stable
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  publish:
    name: publish multi-arch image
    if: github.repository == 'mdboard-io/mdboard'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: mdboard/mdboard
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/upstream' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/nightly' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=mdboard
            org.opencontainers.image.description=Markdown-native, Git-backed board engine
            org.opencontainers.image.source=https://github.com/mdboard-io/mdboard
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.ref == 'refs/heads/upstream' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.ref == 'refs/heads/upstream' && 'dev' || github.ref_name) }}
            MDBOARD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=mdboard-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=mdboard-${{ github.ref_name }}
          provenance: true
          sbom: true
