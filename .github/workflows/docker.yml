name: docker

on:
  push:
    branches:
      - upstream
      - nightly
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: test before publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              tail -200 /tmp/clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
      - run: cargo test --workspace --locked

  prepare:
    name: prepare image metadata
    if: github.repository == 'mdboard-io/mdboard'
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      build_date: ${{ steps.meta.outputs.build_date }}
      tag_suffix: ${{ steps.meta.outputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Advance build metadata
        run: cargo run -q -p mdboard-cli -- --actor agent version prepare-build
      - id: meta
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            upstream) channel=preview ;;
            nightly) channel=nightly ;;
            stable) channel=stable ;;
            *) channel=dev ;;
          esac
          version="$(tr -d '\r\n' < VERSION)"
          build="$(tr -d '\r\n' < BUILD)"
          build_date="$(tr -d '\r\n' < BUILD_DATE)"
          case "$channel" in
            preview|dev) tag_suffix="-${build}" ;;
            *) tag_suffix="" ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${tag_suffix}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: |
            VERSION
            BUILD
            BUILD_DATE
            TAG
          retention-days: 1

  build-linux:
    name: build linux/${{ matrix.arch }}
    if: github.repository == 'mdboard-io/mdboard'
    needs: [verify, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        shell: bash
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          TAG_SUFFIX: ${{ needs.prepare.outputs.tag_suffix }}
          ARCH: ${{ matrix.arch }}
        run: |
          version_tag="mdboard/mdboard:linux-${ARCH}-${CHANNEL}-${VERSION}${TAG_SUFFIX}"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "nightly" ] || [ "$CHANNEL" = "stable" ]; then
            latest_tag="mdboard/mdboard:linux-${ARCH}-${CHANNEL}-latest"
            echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
            printf '%s\n%s\n' "$version_tag" "$latest_tag" > /tmp/tags.txt
          else
            printf '%s\n' "$version_tag" > /tmp/tags.txt
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          {
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(cat BUILD_DATE)"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.title=mdboard"
            echo "org.opencontainers.image.licenses=AGPL-3.0-only"
            echo "io.mdboard.build=${BUILD}"
            echo "io.mdboard.channel=${CHANNEL}"
          } > /tmp/labels.txt
          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/labels.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD=${{ needs.prepare.outputs.build }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            MDBOARD_CHANNEL=${{ needs.prepare.outputs.channel }}
            MDBOARD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=mdboard-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mdboard-linux-${{ matrix.arch }}
          provenance: true
          sbom: true
      - name: Record digest
        shell: bash
        run: echo "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          retention-days: 1

  build-windows:
    name: build windows/amd64
    if: github.repository == 'mdboard-io/mdboard'
    needs: [verify, prepare]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build Windows binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p mdboard-cli
      - name: Prepare Windows build context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path win-context | Out-Null
          Copy-Item Dockerfile.windows win-context\Dockerfile.windows
          Copy-Item target\x86_64-pc-windows-msvc\release\mdboard.exe win-context\mdboard.exe
          Copy-Item LICENSE win-context\LICENSE
          Copy-Item NOTICE win-context\NOTICE
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Windows image
        shell: pwsh
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          TAG_SUFFIX: ${{ needs.prepare.outputs.tag_suffix }}
        run: |
          $base = "mdboard/mdboard:windows-amd64-$env:CHANNEL-$env:VERSION$env:TAG_SUFFIX"
          $tags = @($base)
          if ($env:CHANNEL -eq "nightly" -or $env:CHANNEL -eq "stable") {
            $tags += "mdboard/mdboard:windows-amd64-$env:CHANNEL-latest"
          }
          $tagArgs = @()
          foreach ($tag in $tags) { $tagArgs += @("-t", $tag) }
          $buildDate = (Get-Content BUILD_DATE -Raw).Trim()
          $labels = @(
            "--label", "org.opencontainers.image.version=$env:VERSION",
            "--label", "org.opencontainers.image.revision=$env:GITHUB_SHA",
            "--label", "org.opencontainers.image.created=$buildDate",
            "--label", "org.opencontainers.image.source=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY",
            "--label", "org.opencontainers.image.title=mdboard",
            "--label", "org.opencontainers.image.licenses=AGPL-3.0-only",
            "--label", "io.mdboard.build=$env:BUILD",
            "--label", "io.mdboard.channel=$env:CHANNEL"
          )
          docker build @tagArgs @labels `
            --build-arg "VERSION=$env:VERSION" `
            --build-arg "BUILD=$env:BUILD" `
            --build-arg "BUILD_DATE=$buildDate" `
            --build-arg "MDBOARD_CHANNEL=$env:CHANNEL" `
            --build-arg "MDBOARD_COMMIT=$env:GITHUB_SHA" `
            -f win-context\Dockerfile.windows win-context
          foreach ($tag in $tags) { docker push $tag }

  manifests:
    name: assemble linux manifests
    if: github.repository == 'mdboard-io/mdboard'
    needs: [prepare, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create Linux manifests
        shell: bash
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          TAG_SUFFIX: ${{ needs.prepare.outputs.tag_suffix }}
        run: |
          amd64="mdboard/mdboard:linux-amd64-${CHANNEL}-${VERSION}${TAG_SUFFIX}"
          arm64="mdboard/mdboard:linux-arm64-${CHANNEL}-${VERSION}${TAG_SUFFIX}"
          docker buildx imagetools create \
            --tag "mdboard/mdboard:linux-${CHANNEL}-${VERSION}${TAG_SUFFIX}" \
            "$amd64" "$arm64"
          if [ "$CHANNEL" = "nightly" ] || [ "$CHANNEL" = "stable" ]; then
            docker buildx imagetools create \
                --tag "mdboard/mdboard:linux-${CHANNEL}-latest" \
              "$amd64" "$arm64"
          fi
