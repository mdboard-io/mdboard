name: ci

on:
  push:
    branches:
      - main
      - nightly
      - upstream
      - stable
      - "spaces/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: ./sbin/check-licensing.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo test --workspace --locked
      - name: Version banner (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -q -p mdboard-cli -- --version | tee /tmp/mdboard-version.txt
          version="$(tr -d '\r\n' < VERSION)"
          grep -F "mdboard ${version}" /tmp/mdboard-version.txt
      - name: CLI fixture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R tests/fixtures/minimal "$tmp/board"
          cargo run -q -p mdboard-cli -- --root "$tmp/board" check
          cargo run -q -p mdboard-cli -- --root "$tmp/board" render
          cargo run -q -p mdboard-cli -- --root "$tmp/board" render --check
          rm -rf "$tmp"

  docker-build:
    name: docker build (no push)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mdboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            MDBOARD_COMMIT=${{ github.sha }}
      - name: Smoke test image
        run: |
          docker run --rm mdboard:ci --version
          docker run --rm mdboard:ci --help >/dev/null
