name: Bug report
description: Report a reproducible defect in mdboard
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mdboard --version`
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal commands, board shape and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Diagnostics
      description: Relevant `mdboard check --json` or `check --git --json` output
  - type: markdown
    attributes:
      value: Do not include tokens, private customer data or full private reports.
